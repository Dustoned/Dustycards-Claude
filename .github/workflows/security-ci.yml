name: Security and release checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Generate database client
        run: npx prisma generate
      - name: Apply database migrations to the CI snapshot
        run: npx prisma migrate deploy
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Production build
        env:
          AUTH_MFA_ENCRYPTION_KEY: ci-only-security-key-that-is-long-enough
          DATABASE_URL: file:./ci.db
          NEXT_PUBLIC_APP_BUILD: ci-${{ github.sha }}
        run: npm run build -- --webpack
