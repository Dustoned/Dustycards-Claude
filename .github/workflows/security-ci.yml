name: Security and release checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: file:./dustycards.db
      AUTH_MFA_ENCRYPTION_KEY: ci-only-security-key-that-is-long-enough
      SECURITY_EVENT_HASH_KEY: ci-only-event-hash-key-that-is-long-enough
      NEXT_PUBLIC_APP_BUILD: ci-${{ github.sha }}
      PLAYWRIGHT_SERVER_MODE: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Generate database client
        run: npx prisma generate
      - name: Prepare and migrate the CI database
        run: |
          cp data/dustycards.app.db dustycards.db
          npx prisma migrate deploy
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build -- --webpack
      - name: Account and collection regression tests
        run: DUSTYCARDS_DATABASE_PATH="$PWD/dustycards.db" npm run smoke -- tests/smoke/security.spec.ts --workers=1 --timeout=120000
      - name: Install browser for UI regressions
        run: npx playwright install --with-deps chromium
      - name: Passkey registration and sign-in regressions
        run: APP_URL="http://localhost:3000" DUSTYCARDS_DATABASE_PATH="$PWD/dustycards.db" npm run smoke -- tests/smoke/passkeys.spec.ts --workers=1 --timeout=120000
      - name: Mobile, desktop and account UI regressions
        run: DUSTYCARDS_DATABASE_PATH="$PWD/dustycards.db" npm run smoke -- tests/smoke/ui-polish.spec.ts tests/smoke/account-ui.spec.ts --workers=1 --timeout=120000
      - name: Card, Radar and sealed detail regressions
        run: DUSTYCARDS_DATABASE_PATH="$PWD/dustycards.db" npm run smoke -- tests/smoke/app.spec.ts --grep "card detail uses an aligned|Signal Radar detail shares|Signal Radar tabs wait|sealed detail aligns" --workers=1 --timeout=120000
