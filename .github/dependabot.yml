version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    groups:
      production-security:
        dependency-type: production
        update-types: [patch, minor]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "05:30"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 3
